<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>অ্যাডমিন প্যানেল</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; padding: 20px; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .card h3 { color: #6c5ce7; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        /* Manual Access Section */
        .manual-box { display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .manual-box input { flex: 1; min-width: 250px; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
        .manual-box input:focus { border-color: #00b894; }
        .manual-box button { background: #00b894; color: white; border: none; padding: 12px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; transition: 0.3s; }
        .manual-box button:hover { background: #00a884; }

        /* Table Section */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; font-size: 14px; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; vertical-align: top; }
        th { background: #f8f9fa; color: #333; font-weight: bold; white-space: nowrap; }
        tr:hover { background-color: #fcfcfc; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-form { background: #e8f5e9; color: #2e7d32; }
        .badge-manual { background: #e3f2fd; color: #1565c0; }
        .badge-male { background: #fff3e0; color: #e65100; }
        .badge-female { background: #fce4ec; color: #c2185b; }
        .highlight { color: #d63031; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3><i class="fas fa-unlock-alt"></i> ম্যানুয়াল অ্যাক্সেস দিন</h3>
            <div class="manual-box">
                <input type="email" id="adminEmail" placeholder="স্টুডেন্টের ইমেইল অ্যাড্রেস লিখুন" required>
                <button onclick="grantManualAccess()">অ্যাক্সেস দিন</button>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-list-alt"></i> স্টুডেন্ট ডাটাবেস ও লগ</h3>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>তারিখ ও সময়</th>
                            <th>বেসিক তথ্য</th>
                            <th>পেমেন্ট ও স্ট্যাটাস</th>
                            <th>একাডেমিক তথ্য</th>
                            <th>মাধ্যম</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <tr><td colspan="5" style="text-align:center; padding: 30px;">ডাটা লোড হচ্ছে...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBK1T5Nr1CjoPVWPsKnytrgjj05nU8fDs0", authDomain: "hstu---cou--exam-2026.firebaseapp.com", projectId: "hstu---cou--exam-2026", storageBucket: "hstu---cou--exam-2026.firebasestorage.app", messagingSenderId: "1058124789396", appId: "1:1058124789396:web:fc772af33deb7c18c9e681" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Manual Access Function
        async function grantManualAccess() {
            const email = document.getElementById('adminEmail').value.trim().toLowerCase();
            if (!email) return alert('দয়া করে স্টুডেন্টের ইমেইল দিন!');

            document.querySelector('.manual-box button').innerText = 'অপেক্ষা করুন...';
            
            try {
                await db.collection("payment_requests").add({
                    email: email, package: "TextileFull", status: "approved", method: "manual_admin", timestamp: new Date().toISOString()
                });
                document.getElementById('adminEmail').value = '';
                alert('সফলভাবে অ্যাক্সেস দেওয়া হয়েছে!');
                loadHistory();
            } catch (error) { alert('সমস্যা হয়েছে!'); }
            document.querySelector('.manual-box button').innerText = 'অ্যাক্সেস দিন';
        }

        // Load History Log
        async function loadHistory() {
            const tbody = document.getElementById('logTableBody');
            try {
                const snapshot = await db.collection("payment_requests").where("status", "==", "approved").get();
                let logs = [];
                snapshot.forEach(doc => logs.push(doc.data()));
                
                logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                tbody.innerHTML = '';
                if(logs.length === 0) return tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">কোনো ডাটা নেই</td></tr>';

                logs.forEach(log => {
                    const dateObj = log.timestamp ? new Date(log.timestamp) : new Date();
                    const dateStr = dateObj.toLocaleDateString('bn-BD') + "<br><small style='color:#888;'>" + dateObj.toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit'}) + "</small>";
                    
                    const methodBadge = log.method === 'student_form' ? '<span class="badge badge-form">ফর্ম থেকে সাবমিট</span>' : '<span class="badge badge-manual">ম্যানুয়াল (Admin)</span>';
                    const genderBadge = log.gender === 'Male' ? '<span class="badge badge-male">Male</span>' : (log.gender === 'Female' ? '<span class="badge badge-female">Female</span>' : '');
                    
                    if (log.method === 'manual_admin') {
                        tbody.innerHTML += `<tr><td>${dateStr}</td><td><b>-</b><br><span style="color:#6c5ce7">${log.email}</span></td><td>-</td><td>-</td><td>${methodBadge}</td></tr>`;
                    } else {
                        tbody.innerHTML += `
                            <tr>
                                <td>${dateStr}</td>
                                <td><b>${log.name}</b><br><span style="color:#6c5ce7">${log.email}</span><br><i class="fas fa-phone-alt" style="font-size:10px; color:#888;"></i> ${log.phone}</td>
                                <td>লাস্ট ৩ ডিজিট: <span class="highlight">${log.last3}</span><br>${genderBadge}</td>
                                <td><b>কলেজ:</b> ${log.college}<br><small style="color:#666;"><b>ব্যাচ:</b> ${log.hscBatch} | <b>Strong:</b> ${log.strongSub} | <b>Weak:</b> ${log.weakSub}</small></td>
                                <td>${methodBadge}</td>
                            </tr>
                        `;
                    }
                });
            } catch (error) { tbody.innerHTML = '<tr><td colspan="5">ডাটা লোড করতে সমস্যা হয়েছে।</td></tr>'; }
        }

        loadHistory();
    </script>
</body>
</html>
