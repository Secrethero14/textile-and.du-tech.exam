<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>কোর্সে ভর্তি ফর্ম</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        .form-card h2 { color: #6c5ce7; text-align: center; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #2d3436; font-size: 14px; }
        .input-group input, .input-group select { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.3s; }
        .input-group input:focus, .input-group select:focus { border-color: #6c5ce7; }
        .row { display: flex; gap: 15px; }
        .row .input-group { flex: 1; }
        .btn-submit { background: #6c5ce7; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-submit:hover { background: #5a4bcf; }
        .optional-text { color: #888; font-size: 12px; font-weight: normal; }
        
        /* Success Section */
        #successSection { display: none; text-align: center; }
        .success-icon { font-size: 60px; color: #00b894; margin-bottom: 15px; }
        .contact-btn { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold; margin-bottom: 10px; transition: 0.3s; }
        .btn-wa { background: #25D366; } .btn-wa:hover { background: #1ebe5d; }
        .btn-tg { background: #0088cc; } .btn-tg:hover { background: #007bb5; }
    </style>
</head>
<body>

    <div class="form-card" id="formContainer">
        <h2>📝 পেমেন্ট ও তথ্য সাবমিট</h2>
        <p style="text-align:center; color:#666; font-size:14px; margin-bottom:20px;">নিচের তথ্যগুলো দিয়ে আপনার কোর্স আনলক করুন</p>
        
        <div class="input-group">
            <label>আপনার নাম *</label>
            <input type="text" id="sName" placeholder="সম্পূর্ণ নাম লিখুন" required>
        </div>
        
        <div class="input-group">
            <label>লগইন করা ইমেইল *</label>
            <input type="email" id="sEmail" placeholder="ওয়েবসাইটে যে ইমেইল দিয়ে লগইন করেছেন" required>
        </div>

        <div class="row">
            <div class="input-group">
                <label>ফোন নম্বর *</label>
                <input type="tel" id="sPhone" placeholder="01XXXXXXXXX" required>
            </div>
            <div class="input-group">
                <label>টাকা পাঠানোর লাস্ট ৩ ডিজিট *</label>
                <input type="text" id="sLast3" placeholder="যেমন: 583" maxlength="3" required>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>জেন্ডার *</label>
                <select id="sGender" required>
                    <option value="">নির্বাচন করুন</option>
                    <option value="Male">Male (ছাত্র)</option>
                    <option value="Female">Female (ছাত্রী)</option>
                </select>
            </div>
            <div class="input-group">
                <label>HSC ব্যাচ <span class="optional-text">(ঐচ্ছিক)</span></label>
                <input type="text" id="sBatch" placeholder="যেমন: 2024">
            </div>
        </div>

        <div class="input-group">
            <label>কলেজের নাম *</label>
            <input type="text" id="sCollege" placeholder="আপনার কলেজের নাম লিখুন" required>
        </div>

        <div class="row">
            <div class="input-group">
                <label>দুর্বল বিষয় <span class="optional-text">(ঐচ্ছিক)</span></label>
                <input type="text" id="sWeak" placeholder="যেমন: Physics">
            </div>
            <div class="input-group">
                <label>স্ট্রং বিষয় <span class="optional-text">(ঐচ্ছিক)</span></label>
                <input type="text" id="sStrong" placeholder="যেমন: Math">
            </div>
        </div>

        <button class="btn-submit" onclick="submitForm()">সাবমিট করুন</button>
    </div>

    <div class="form-card" id="successSection">
        <i class="fas fa-check-circle success-icon"></i>
        <h2 style="color: #00b894; border:none;">সাবমিট সফল হয়েছে!</h2>
        <p style="color: #2d3436; font-size: 16px; margin-bottom: 25px;">
            আপনার অ্যাকাউন্টে এক্সাম আনলক হয়ে গেছে।<br><br>
            <b>প্রাইভেট গ্রুপে অ্যাড হতে আপনার নাম জানিয়ে নিচের যেকোনো লিংকে মেসেজ দিন:</b>
        </p>
        
        <a href="https://wa.me/8801925251621" target="_blank" class="contact-btn btn-wa">
            <i class="fab fa-whatsapp" style="font-size: 20px;"></i> WhatsApp -এ মেসেজ দিন
        </a>
        <a href="https://t.me/Admissionhelper007" target="_blank" class="contact-btn btn-tg">
            <i class="fab fa-telegram-plane" style="font-size: 20px;"></i> Telegram -এ মেসেজ দিন
        </a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBK1T5Nr1CjoPVWPsKnytrgjj05nU8fDs0", authDomain: "hstu---cou--exam-2026.firebaseapp.com", projectId: "hstu---cou--exam-2026", storageBucket: "hstu---cou--exam-2026.firebasestorage.app", messagingSenderId: "1058124789396", appId: "1:1058124789396:web:fc772af33deb7c18c9e681"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function submitForm() {
            const data = {
                name: document.getElementById('sName').value.trim(),
                email: document.getElementById('sEmail').value.trim().toLowerCase(),
                phone: document.getElementById('sPhone').value.trim(),
                last3: document.getElementById('sLast3').value.trim(),
                gender: document.getElementById('sGender').value,
                college: document.getElementById('sCollege').value.trim(),
                hscBatch: document.getElementById('sBatch').value.trim() || "N/A",
                weakSub: document.getElementById('sWeak').value.trim() || "N/A",
                strongSub: document.getElementById('sStrong').value.trim() || "N/A",
                package: "TextileFull", 
                status: "approved", 
                method: "student_form",
                timestamp: new Date().toISOString()
            };

            if (!data.name || !data.email || !data.phone || !data.last3 || !data.gender || !data.college) {
                return Swal.fire('ভুল!', 'দয়া করে স্টার (*) মার্ক করা সব ঘর পূরণ করুন।', 'warning');
            }

            Swal.fire({ title: 'অপেক্ষা করুন...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            try {
                await db.collection("payment_requests").add(data);
                Swal.close();
                document.getElementById('formContainer').style.display = 'none';
                document.getElementById('successSection').style.display = 'block';
            } catch (error) {
                console.error(error);
                Swal.fire('সমস্যা!', 'ইন্টারনেট কানেকশন চেক করুন।', 'error');
            }
        }
    </script>
</body>
</html>
